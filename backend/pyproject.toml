[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foxmesh"
version = "0.1.0"
description = "Blender-based 3D generation platform with automatic AI model selection"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
foxmesh = "foxmesh.cli:main"

[tool.setuptools.packages.find]
include = ["foxmesh*"]

[tool.setuptools.package-data]
foxmesh = ["registry/models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
