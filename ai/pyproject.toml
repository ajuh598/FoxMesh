[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foxmesh-ai"
version = "0.1.0"
description = "FoxMesh's own text/image-to-3D model and the library to build datasets, train, evaluate and version it"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
# Training and inference need PyTorch; dataset tools and geometry do not.
torch = ["torch>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
foxmesh-ai = "foxmesh_ai.cli:main"

[tool.setuptools.packages.find]
include = ["foxmesh_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
